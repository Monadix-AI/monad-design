name: Bug report
description: Report a reproducible problem in Monad Design
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove private project data, credentials, pairing codes, and sensitive screenshots before submitting.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start ...
        2. Connect ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, macOS, Xcode, Simulator runtime, device, and Bun versions that apply.
      render: text
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Core
        - Desktop
        - Mobile/iPad
        - Shared package
        - Documentation or tooling
        - Unsure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or evidence
      description: Paste sanitized logs or attach a screenshot or recording when helpful.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed credentials, pairing data, private source, and other sensitive information.
          required: true
        - label: This is not a security vulnerability. I will use the private process in SECURITY.md for vulnerabilities.
          required: true
