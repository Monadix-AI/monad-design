name: Feature request
description: Propose a focused product or developer-experience improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or user need is not served today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior without requiring a particular implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note current workarounds or other approaches you considered.

  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Core
        - Desktop
        - Mobile/iPad
        - Shared package or protocol
        - Documentation or tooling
        - Cross-project
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues and pull requests for this request.
          required: true
        - label: I described a real workflow need rather than only a preferred implementation.
          required: true
